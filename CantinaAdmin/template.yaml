AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CantinaAdmin - Discord community administration bot

Globals:
  Function:
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON

Resources:
  CantinaAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cantina_admin/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        DiscordInteractions:
          Type: Api
          Properties:
            Path: /interactions
            Method: post

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

Outputs:
  DiscordInteractionsApi:
    Description: API Gateway endpoint for CantinaAdmin Discord interactions
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/interactions"

  CantinaAdminFunctionArn:
    Description: CantinaAdmin Lambda function ARN
    Value: !GetAtt CantinaAdminFunction.Arn

  CantinaAdminFunctionIamRole:
    Description: IAM role created for the CantinaAdmin function
    Value: !GetAtt CantinaAdminFunctionRole.Arn